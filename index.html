<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>尺寸投影</title>
<script>
  /* ====== 在这里填 Variant Launch 的 SDK 密钥（launchar.app 后台里的 SDK Key） ====== */
  window.LAUNCH_KEY = "YOUR_SDK_KEY";
  /* ============================================================================== */
  if (window.LAUNCH_KEY && window.LAUNCH_KEY !== "YOUR_SDK_KEY")
    document.write('<script src="https://launchar.app/sdk/v1?key=' + encodeURIComponent(window.LAUNCH_KEY) + '&redirect=true"><\/script>');
</script>
<style>
  :root { --accent:#e2603a; --ink:#22252a; --sub:#6b7280; --line:#e3ded6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans SC",sans-serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---------- 进入相机前的首页 ---------- */
  #app { position:fixed; inset:0; z-index:5; background:#f4f1ec; display:flex; flex-direction:column; justify-content:center;
    padding:28px 22px; overflow:auto; }
  #app h1 { font-size:28px; margin:0 0 8px; }
  #app p { color:var(--sub); font-size:15px; line-height:1.6; margin:0 0 14px; }
  #app ol { color:var(--sub); font-size:14px; line-height:1.8; padding-left:20px; margin:0 0 22px; }
  #start { border:0; border-radius:14px; background:var(--accent); color:#fff; font-size:18px; font-weight:600; padding:16px; width:100%; }
  #start:disabled { opacity:.4; }
  #status { margin-top:14px; padding:12px; border-radius:10px; background:#fff4e5; color:#7a4a00; font-size:14px; line-height:1.6; display:none; }
  #status.show { display:block; }
  #status a { color:inherit; font-weight:600; }
  #app .alt { margin-top:18px; font-size:13px; text-align:center; }
  #app .alt a { color:var(--sub); }

  /* ---------- 相机里的操作界面 ---------- */
  #overlay { display:none; position:fixed; inset:0; z-index:10; pointer-events:none; color:#fff; }
  #overlay.on { display:block; }
  #overlay > * { pointer-events:auto; }
  #top { position:absolute; left:0; right:0; top:0; padding:calc(10px + env(safe-area-inset-top)) 12px 10px; display:flex; gap:10px; align-items:flex-start;
    background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0)); pointer-events:none !important; }
  #top > * { pointer-events:auto; }
  #hud { flex:1; min-width:0; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  #hint { font-size:15px; font-weight:600; line-height:1.4; }
  #sum { font-size:13px; opacity:.9; margin-top:2px; }
  #exit { border:0; border-radius:999px; background:rgba(0,0,0,.5); color:#fff; font-size:14px; padding:8px 14px; }
  #cross { position:absolute; left:50%; top:42%; width:26px; height:26px; margin:-13px 0 0 -13px; border:2px solid rgba(255,255,255,.9); border-radius:50%;
    box-shadow:0 0 0 1px rgba(0,0,0,.35); pointer-events:none !important; }
  #cross::after { content:""; position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px; background:#fff; border-radius:50%; }

  #panel { position:absolute; left:0; right:0; bottom:0; padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    background:rgba(20,22,26,.78); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-radius:18px 18px 0 0; }
  #cats { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
  #cats::-webkit-scrollbar { display:none; }
  #cats button { flex:none; border:1px solid rgba(255,255,255,.22); background:none; color:#fff; border-radius:999px; padding:6px 12px; font-size:14px; white-space:nowrap; }
  #cats button.on { background:#fff; color:var(--ink); border-color:#fff; font-weight:600; }
  #dims { display:flex; gap:6px; margin-bottom:8px; }
  .fld { flex:1; min-width:0; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); color:#fff; border-radius:10px; padding:5px 4px; text-align:center; }
  .fld small { display:block; font-size:11px; opacity:.7; }
  .fld b { font-size:18px; font-weight:600; }
  .fld.on { border-color:var(--accent); background:rgba(226,96,58,.25); }
  .fld[hidden] { display:none; }
  #steps { display:flex; gap:6px; margin-bottom:10px; }
  #steps button { flex:1; border:0; border-radius:10px; background:rgba(255,255,255,.14); color:#fff; font-size:15px; padding:9px 0; }
  #steps button.key { flex:.8; font-size:13px; }
  #acts { display:flex; gap:8px; align-items:stretch; }
  #acts .rot { flex:none; width:58px; border:0; border-radius:14px; background:rgba(255,255,255,.14); color:#fff; font-size:22px; }
  #main { flex:1; border:0; border-radius:14px; background:var(--accent); color:#fff; font-size:18px; font-weight:700; padding:15px 0; }
  #main:disabled { opacity:.45; }
  #more { display:flex; gap:8px; margin-top:8px; }
  #more button { flex:1; border:1px solid rgba(255,255,255,.22); background:none; color:#fff; border-radius:10px; font-size:14px; padding:8px 0; }
  #more button[hidden] { display:none; }
  #typer { position:absolute; left:12px; right:12px; top:calc(70px + env(safe-area-inset-top)); display:none; gap:8px; background:rgba(20,22,26,.92); padding:10px; border-radius:12px; }
  #typer.on { display:flex; }
  #typer input { flex:1; min-width:0; font-size:20px; padding:8px 10px; border-radius:8px; border:0; -webkit-user-select:text; user-select:text; }
  #typer button { border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:16px; padding:0 16px; }
</style>
</head>
<body>

<div id="overlay">
  <div id="top">
    <div id="hud"><div id="hint"></div><div id="sum"></div></div>
    <button id="exit" type="button">退出</button>
  </div>
  <div id="cross"></div>
  <div id="typer"><input id="typerIn" type="number" inputmode="decimal" step="any"><button id="typerOk" type="button">确定</button></div>
  <div id="panel">
    <div id="cats"></div>
    <div id="dims">
      <button class="fld" type="button" data-i="0"><small></small><b></b></button>
      <button class="fld" type="button" data-i="1"><small></small><b></b></button>
      <button class="fld" type="button" data-i="2"><small></small><b></b></button>
    </div>
    <div id="steps">
      <button type="button" data-d="-10">−10</button><button type="button" data-d="-1">−1</button>
      <button type="button" class="key" id="keyb">输入</button>
      <button type="button" data-d="1">＋1</button><button type="button" data-d="10">＋10</button>
    </div>
    <div id="acts">
      <button class="rot" type="button" id="rotL" aria-label="向左旋转">↺</button>
      <button id="main" type="button">放置</button>
      <button class="rot" type="button" id="rotR" aria-label="向右旋转">↻</button>
    </div>
    <div id="more">
      <button type="button" id="bMove" hidden>移动</button>
      <button type="button" id="bDel" hidden>删除</button>
      <button type="button" id="bClear" hidden>清空</button>
      <button type="button" id="bCancel" hidden>取消</button>
    </div>
  </div>
</div>

<div id="app">
  <h1>尺寸投影</h1>
  <p>像在游戏里摆家具一样：用准星瞄准地面，按真实尺寸放下，再随时改尺寸、旋转、挪位置。</p>
  <ol>
    <li>进入相机后，对着地面慢慢移动手机，直到出现绿色虚影。</li>
    <li>在底部选品类、调尺寸（单位：厘米），虚影会实时变化。</li>
    <li>点“放置”固定；放下后改尺寸会直接作用在这件物体上。</li>
  </ol>
  <button id="start" type="button" disabled>进入相机</button>
  <div id="status"></div>
  <div class="alt"><a href="classic.html">用旧版（系统自带 AR 预览）</a></div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* 品类：每个品类用几个方块拼出简化模型，外轮廓严格等于输入的尺寸 */
const B = (w, h, d, x, y, z, s) => ({ w, h, d, x, y, z, s });   // x/z 为中心，y 为底面高度，s 为配色 a/b/c
const WOOD = [[0.74,0.56,0.37],[0.52,0.38,0.25],[0.22,0.22,0.24]];
const CATS = {
  rug: { name: "地毯", icon: "🧶", labels: ["长", "宽"], def: [160, 230], flat: true,
    pal: [[0.72,0.40,0.30],[0.90,0.82,0.70],[1,1,1]],
    parts: (l, w) => [B(l, 0.01, w, 0, 0, 0, "a"), B(l * 0.86, 0.002, w * 0.86, 0, 0.01, 0, "b")] },
  table: { name: "桌子", icon: "🪵", labels: ["长", "宽", "高"], def: [120, 60, 75], pal: WOOD,
    parts: (l, w, h) => {
      const tt = Math.min(0.04, h * 0.15), s = Math.min(0.06, l * 0.12, w * 0.12), inset = Math.min(0.03, l * 0.05, w * 0.05);
      const lx = l / 2 - inset - s / 2, lz = w / 2 - inset - s / 2;
      return [B(l, tt, w, 0, h - tt, 0, "a"),
        B(s, h - tt, s, lx, 0, lz, "b"), B(s, h - tt, s, -lx, 0, lz, "b"),
        B(s, h - tt, s, lx, 0, -lz, "b"), B(s, h - tt, s, -lx, 0, -lz, "b")];
    } },
  chair: { name: "椅子", icon: "🪑", labels: ["宽", "深", "高"], def: [45, 50, 85], pal: WOOD,
    parts: (l, w, h) => {
      const sh = Math.min(0.45, h * 0.55), st = Math.min(0.04, sh * 0.2), s = Math.min(0.04, l * 0.12, w * 0.12);
      const lx = l / 2 - s / 2, lz = w / 2 - s / 2;
      return [B(l - 0.004, st, w - 0.004, 0, sh - st, 0, "a"),
        B(s, sh - st, s, lx, 0, lz, "b"), B(s, sh - st, s, -lx, 0, lz, "b"),
        B(s, h, s, lx, 0, -lz, "b"), B(s, h, s, -lx, 0, -lz, "b"),
        B(l - 2 * s, (h - sh) * 0.5, s * 0.6, 0, sh + (h - sh) * 0.5, -lz, "a")];
    } },
  sofa: { name: "沙发", icon: "🛋️", labels: ["宽", "深", "高"], def: [200, 90, 85],
    pal: [[0.47,0.54,0.62],[0.36,0.42,0.50],[0.9,0.9,0.9]],
    parts: (l, w, h) => {
      const sh = Math.min(0.42, h * 0.55), aw = Math.min(0.18, l * 0.12), bt = Math.min(0.22, w * 0.25);
      const ah = Math.min(h, sh + 0.2), ch = Math.min(0.12, sh * 0.3);
      return [B(l, h, bt, 0, 0, -w / 2 + bt / 2, "a"),
        B(aw, ah, w - bt, l / 2 - aw / 2, 0, bt / 2, "a"), B(aw, ah, w - bt, -(l / 2 - aw / 2), 0, bt / 2, "a"),
        B(l - 2 * aw, sh - ch, w - bt - 0.02, 0, 0, bt / 2 - 0.01, "b"),
        B(l - 2 * aw, ch, w - bt, 0, sh - ch, bt / 2, "a")];
    } },
  bed: { name: "床", icon: "🛏️", labels: ["宽", "长", "床头高"], def: [150, 200, 90],
    pal: [[0.62,0.50,0.40],[0.45,0.35,0.27],[0.95,0.94,0.92]],
    parts: (l, w, h) => {
      const ht = Math.min(0.06, w * 0.05), mh = Math.min(0.5, h * 0.6), fh = mh * 0.5;
      const pw = Math.min(0.6, l * 0.42), pd = Math.min(0.4, w * 0.2), pz = -w / 2 + ht + Math.min(0.06, w * 0.03) + pd / 2;
      return [B(l, h, ht, 0, 0, -w / 2 + ht / 2, "a"),
        B(l, fh, w - ht, 0, 0, ht / 2, "b"),
        B(l - 0.04, mh - fh, w - ht - 0.04, 0, fh, ht / 2, "c"),
        B(pw, Math.min(0.08, h - mh), pd, l / 4, mh, pz, "a"), B(pw, Math.min(0.08, h - mh), pd, -l / 4, mh, pz, "a")];
    } },
  cabinet: { name: "柜子", icon: "🚪", labels: ["宽", "深", "高"], def: [80, 40, 180], pal: WOOD,
    parts: (l, w, h) => {
      const n = l < 0.6 ? 1 : 2, fh = Math.min(0.06, h * 0.08), g = 0.008, dw = (l - g * (n + 1)) / n, dh = h - fh - g;
      const hh = Math.min(0.14, dh * 0.3), out = [B(l, h, w - 0.012, 0, 0, -0.006, "b")];
      for (let i = 0; i < n; i++) {
        const cx = -l / 2 + g + dw / 2 + i * (dw + g);
        out.push(B(dw, dh, 0.008, cx, fh, w / 2 - 0.008, "a"));
        const hx = n === 1 ? cx + dw / 2 - 0.04 : cx + (i === 0 ? 1 : -1) * (dw / 2 - 0.03);
        const lim = Math.max(0, l / 2 - 0.006), hxc = Math.max(-lim, Math.min(lim, hx));
        out.push(B(Math.min(0.012, l), hh, 0.004, hxc, fh + dh / 2 - hh / 2, w / 2 - 0.002, "c"));
      }
      return out;
    } },
  shelf: { name: "置物架", icon: "📚", labels: ["宽", "深", "高"], def: [80, 30, 150], pal: WOOD,
    parts: (l, w, h) => {
      const t = Math.min(0.02, l * 0.05, h * 0.05), n = Math.max(2, Math.round(h / 0.35)) + 1;
      const out = [B(t, h, w, l / 2 - t / 2, 0, 0, "a"), B(t, h, w, -(l / 2 - t / 2), 0, 0, "a")];
      for (let i = 0; i < n; i++) out.push(B(l - 2 * t, t, w - 0.004, 0, i * (h - t) / (n - 1), 0, "b"));
      return out;
    } },
  box: { name: "箱子", icon: "📦", labels: ["长", "宽", "高"], def: [60, 40, 35],
    pal: [[0.80,0.84,0.88],[0.36,0.50,0.64],[1,1,1]],
    parts: (l, w, h) => { const lh = Math.min(0.06, h * 0.15);
      return [B(l - 0.01, h - lh, w - 0.01, 0, 0, 0, "a"), B(l, lh, w, 0, h - lh, 0, "b")]; } },
  appliance: { name: "家电", icon: "🧊", labels: ["宽", "深", "高"], def: [60, 65, 170],
    pal: [[0.80,0.82,0.85],[0.94,0.95,0.96],[0.28,0.31,0.35]],
    parts: (l, w, h) => {
      const out = [B(l, h, w - 0.012, 0, 0, -0.006, "a")], pz = w / 2 - 0.008, hz = w / 2 - 0.002, pw = l - 0.012;
      if (h >= 1.1) {           // 高的按冰箱画：上下两扇门
        const split = h * 0.4;
        out.push(B(pw, split - 0.03, 0.008, 0, 0.024, pz, "b"), B(pw, h - split - 0.012, 0.008, 0, split + 0.006, pz, "b"));
        out.push(B(0.014, Math.min(0.3, h * 0.2), 0.004, l / 2 - 0.05, split + 0.05, hz, "c"),
                 B(0.014, Math.min(0.2, split * 0.3), 0.004, l / 2 - 0.05, split - 0.05 - Math.min(0.2, split * 0.3), hz, "c"));
      } else {                  // 矮的按洗衣机画：一块面板加一个视窗
        const q = Math.min(l, h) * 0.5;
        out.push(B(pw, h - 0.03, 0.008, 0, 0.024, pz, "b"), B(q, q, 0.004, 0, (h - q) / 2, hz, "c"));
      }
      return out;
    } },
  other: { name: "其他", icon: "⬜", labels: ["长", "宽", "高"], def: [60, 40, 80],
    pal: [[0.89,0.38,0.23],[0.7,0.3,0.18],[1,1,1]],
    parts: (l, w, h) => [B(l, h, w, 0, 0, 0, "a")] }
};
const RUG_H = 0.012;

const $ = id => document.getElementById(id);
const KEY_SET = window.LAUNCH_KEY && window.LAUNCH_KEY !== "YOUR_SDK_KEY";
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const overlay = $("overlay"), app = $("app"), startBtn = $("start"), statusBox = $("status"), mainBtn = $("main");

/* ---------- three.js 场景 ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 40);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8c8c8c, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1.5, 4, 2); scene.add(sun);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.insertBefore(renderer.domElement, document.body.firstChild);
addEventListener("resize", () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

const ghostMat = new THREE.MeshBasicMaterial({ color: 0x35d07f, transparent: true, opacity: 0.36, depthWrite: false });
const edgeMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 });
const footMat = new THREE.LineBasicMaterial({ color: 0xffe14d });

const meters = it => { const C = CATS[it.cat]; return [it.d[0] / 100, it.d[1] / 100, C.flat ? RUG_H : it.d[2] / 100]; };

function makeGroup(it, ghost) {
  const C = CATS[it.cat], [l, w, h] = meters(it), g = new THREE.Group();
  for (const p of C.parts(l, w, h)) {
    const geo = new THREE.BoxGeometry(p.w, p.h, p.d);
    const c = C.pal["abc".indexOf(p.s)];
    const mat = ghost ? ghostMat
      : new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace), roughness: 0.85, metalness: 0 });
    const m = new THREE.Mesh(geo, mat); m.position.set(p.x, p.y + p.h / 2, p.z); g.add(m);
    if (ghost) { const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat); e.position.copy(m.position); g.add(e); }
  }
  const y = 0.004, pts = [[-l / 2, -w / 2], [l / 2, -w / 2], [l / 2, w / 2], [-l / 2, w / 2]].map(([x, z]) => new THREE.Vector3(x, y, z));
  const foot = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), footMat);
  foot.name = "foot"; foot.visible = false; g.add(foot);
  g.userData.item = it;
  return g;
}
function disposeGroup(g) {
  g.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material !== ghostMat && o.material !== edgeMat && o.material !== footMat) o.material.dispose(); });
}

/* ---------- 状态 ---------- */
let session = null, hitSource = null, floorFound = false, lastHitT = 0;
let mode = "aim";          // aim：虚影跟着准星走；view：已放下，可以走动观察
let cur = null;            // 当前正在调整的物体（虚影，或已放下并选中的那件）
let hovered = null;        // view 模式下准星指着的另一件已放物体
let active = 0;            // 正在调的是第几个尺寸
const placed = [], mem = {};
const camPos = new THREE.Vector3(), camDir = new THREE.Vector3(), tmp = new THREE.Vector3();
const ray = new THREE.Raycaster();

function newItem(cat, d, yaw, needFace) { return { cat, d: d.slice(), yaw: yaw || 0, needFace: !!needFace, group: null }; }

// 按 cur 的当前品类/尺寸重建模型，位置和朝向保持不变
function rebuild() {
  const old = cur.group, ghost = mode === "aim", g = makeGroup(cur, ghost);
  if (old) { g.position.copy(old.position); g.visible = old.visible; scene.remove(old); disposeGroup(old); } else g.visible = false;
  g.rotation.y = cur.yaw;
  if (!ghost) g.getObjectByName("foot").visible = true;
  cur.group = g; scene.add(g); drawPanel();
}
function setSelected(it, on) { if (it && it.group) { const f = it.group.getObjectByName("foot"); if (f) f.visible = on; } }
function removeItem(it) {
  const i = placed.indexOf(it); if (i >= 0) placed.splice(i, 1);
  if (it.group) { scene.remove(it.group); disposeGroup(it.group); it.group = null; }
}
function startGhost(it) {        // 进入瞄准模式，it 作为虚影
  setSelected(cur, false);
  mode = "aim"; hovered = null; cur = it; cur.group = null; rebuild();
}
function selectPlaced(it) {      // 进入观察模式，选中一件已放物体
  setSelected(cur, false);
  mode = "view"; hovered = null; cur = it; setSelected(cur, true); drawPanel();
}

/* ---------- 底部面板 ---------- */
Object.keys(CATS).forEach(k => {
  const b = document.createElement("button"); b.type = "button"; b.dataset.cat = k;
  b.textContent = CATS[k].icon + " " + CATS[k].name;
  b.onclick = () => {
    if (!cur || cur.cat === k) return;
    mem[cur.cat] = cur.d.slice();
    cur.cat = k; cur.d = (mem[k] || CATS[k].def.concat(CATS[k].flat ? [1] : [])).slice(0, 3);
    if (cur.d.length < 3) cur.d.push(1);
    active = 0; closeTyper(); rebuild();
  };
  $("cats").appendChild(b);
});
const flds = [...document.querySelectorAll(".fld")];
flds.forEach(f => f.onclick = () => { active = +f.dataset.i; closeTyper(); drawPanel(); });

function drawPanel() {
  if (!cur) return;
  const C = CATS[cur.cat], n = C.flat ? 2 : 3;
  if (active >= n) active = 0;
  document.querySelectorAll("#cats button").forEach(b => b.classList.toggle("on", b.dataset.cat === cur.cat));
  flds.forEach((f, i) => {
    f.hidden = i >= n; if (i >= n) return;
    f.classList.toggle("on", i === active);
    f.querySelector("small").textContent = C.labels[i] + "（厘米）";
    f.querySelector("b").textContent = cur.d[i];
  });
  $("sum").textContent = C.name + " " + cur.d.slice(0, n).join(" × ") + " 厘米" + (placed.length ? "　·　已放 " + placed.length + " 件" : "");
  $("bMove").hidden = $("bDel").hidden = mode !== "view";
  $("bClear").hidden = !(mode === "view" && placed.length > 1);
  $("bCancel").hidden = !(mode === "aim" && placed.length > 0);
}
function setDim(v) {
  if (!cur || !isFinite(v)) return;
  v = Math.min(2000, Math.max(1, Math.round(v * 10) / 10));
  if (cur.d[active] === v) return;
  cur.d[active] = v; rebuild();
}
// 按一下执行一次，按住连续执行
function hold(el, fn) {
  let t1 = null, t2 = null;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  el.addEventListener("pointerdown", e => { e.preventDefault(); stop(); fn(true); t1 = setTimeout(() => { t2 = setInterval(() => fn(false), 80); }, 350); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(n => el.addEventListener(n, stop));
  el.addEventListener("contextmenu", e => e.preventDefault());
}
document.querySelectorAll("#steps button[data-d]").forEach(b => hold(b, () => { if (cur) setDim(cur.d[active] + (+b.dataset.d)); }));
const rotate = dir => first => { if (!cur) return; cur.yaw += dir * (first ? 15 : 4) * Math.PI / 180; if (cur.group) cur.group.rotation.y = cur.yaw; };
hold($("rotL"), rotate(1)); hold($("rotR"), rotate(-1));

// 用键盘直接输入数字
function closeTyper() { $("typer").classList.remove("on"); $("typerIn").blur(); }
$("keyb").onclick = () => { if (!cur) return; const i = $("typerIn"); i.value = cur.d[active]; $("typer").classList.add("on"); i.focus(); i.select && i.select(); };
$("typerOk").onclick = () => { setDim(parseFloat($("typerIn").value)); closeTyper(); };
$("typerIn").addEventListener("keydown", e => { if (e.key === "Enter") $("typerOk").click(); });

/* ---------- 主按钮和辅助按钮 ---------- */
mainBtn.onclick = () => {
  if (!cur) return;
  if (mode === "aim") {                       // 放置
    if (!cur.group || !cur.group.visible) return;
    mode = "view"; rebuild(); placed.push(cur); setSelected(cur, true); drawPanel();
  } else if (hovered && hovered !== cur) {    // 选中准星指着的那件
    selectPlaced(hovered);
  } else {                                    // 再放一个：同样的品类、尺寸、朝向
    startGhost(newItem(cur.cat, cur.d, cur.yaw, false));
  }
};
$("bMove").onclick = () => {                  // 把选中的物体重新拿起来
  if (mode !== "view" || !cur) return;
  const it = cur; removeItem(it); cur = null; startGhost(newItem(it.cat, it.d, it.yaw, false));
};
$("bDel").onclick = () => {
  if (mode !== "view" || !cur) return;
  const it = cur; removeItem(it); cur = null;
  if (placed.length) selectPlaced(placed[placed.length - 1]); else startGhost(newItem(it.cat, it.d, it.yaw, false));
};
$("bClear").onclick = () => {
  const it = cur; placed.slice().forEach(removeItem); cur = null;
  startGhost(newItem(it.cat, it.d, it.yaw, false));
};
$("bCancel").onclick = () => {                // 放弃手里的虚影，回到观察
  if (mode !== "aim" || !placed.length) return;
  if (cur.group) { scene.remove(cur.group); disposeGroup(cur.group); }
  cur = null; selectPlaced(placed[placed.length - 1]);
};
overlay.addEventListener("beforexrselect", e => e.preventDefault());

/* ---------- 每一帧 ---------- */
let lastLabel = "", lastHint = "";
function setText(label, hint, enabled) {
  if (label !== lastLabel) { mainBtn.textContent = label; lastLabel = label; }
  if (hint !== lastHint) { $("hint").textContent = hint; lastHint = hint; }
  if (mainBtn.disabled === enabled) mainBtn.disabled = !enabled;
}
function onFrame(t, frame) {
  if (frame && session && cur) {
    const ref = renderer.xr.getReferenceSpace();
    let hit = null;
    if (hitSource && ref) {
      const r = frame.getHitTestResults(hitSource);
      if (r.length) { const pose = r[0].getPose(ref); if (pose) { const m = pose.transform.matrix; hit = tmp.set(m[12], m[13], m[14]); } }
    }
    camera.getWorldPosition(camPos); camera.getWorldDirection(camDir);
    if (hit) { floorFound = true; lastHitT = t; }

    if (mode === "aim") {
      const g = cur.group;
      if (hit) {
        if (!g.visible) {
          g.position.copy(hit);
          if (cur.needFace) { cur.yaw = Math.atan2(camPos.x - hit.x, camPos.z - hit.z); cur.needFace = false; }
          g.visible = true;
        } else g.position.lerp(hit, 0.4);
        g.rotation.y = cur.yaw;
      } else if (t - lastHitT > 700) g.visible = false;
      setText("放置", !floorFound ? "对着地面，慢慢左右移动手机" : g.visible ? "瞄准想放的位置，点“放置”" : "把准星对准地面", g.visible);
    } else {
      ray.set(camPos, camDir);
      const hits = ray.intersectObjects(placed.map(p => p.group), true).filter(h => h.object.isMesh);
      let it = null;
      if (hits.length) { let o = hits[0].object; while (o && !o.userData.item) o = o.parent; it = o ? o.userData.item : null; }
      hovered = it && it !== cur ? it : null;
      setText(hovered ? "选中这个" : "＋ 再放一个",
        hovered ? "准星指着另一件：点“选中这个”来调整它" : "已放下。可以走近看；现在改尺寸、旋转都作用在这件上", true);
    }
  }
  renderer.render(scene, camera);
}

/* ---------- 进入 / 退出相机 ---------- */
async function enter() {
  startBtn.disabled = true;
  try {
    session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["local", "hit-test", "dom-overlay"], domOverlay: { root: overlay }
    });
  } catch (e) { startBtn.disabled = false; return showStatus("相机没能打开：" + (e && e.message ? e.message : e) + "。请确认已允许使用相机后再试。"); }
  renderer.xr.setReferenceSpaceType("local");
  await renderer.xr.setSession(session);
  floorFound = false; lastHitT = 0; hitSource = null;
  session.requestReferenceSpace("viewer").then(s => session.requestHitTestSource({ space: s })).then(src => { hitSource = src; })
    .catch(e => { $("hint").textContent = "这台设备不支持地面识别：" + (e && e.message ? e.message : e); });
  session.addEventListener("end", leave);
  app.style.display = "none"; overlay.classList.add("on"); statusBox.classList.remove("show");
  const def = CATS.rug;
  cur = null; startGhost(newItem("rug", def.def.concat([1]), 0, true));
  renderer.setAnimationLoop(onFrame);
}
function leave() {
  renderer.setAnimationLoop(null);
  placed.slice().forEach(removeItem);
  if (cur && cur.group) { scene.remove(cur.group); disposeGroup(cur.group); }
  cur = null; hovered = null; session = null; hitSource = null; closeTyper();
  overlay.classList.remove("on"); app.style.display = ""; startBtn.disabled = false;
}
startBtn.onclick = enter;
$("exit").onclick = () => { if (session) session.end(); };

function showStatus(html) { statusBox.innerHTML = html; statusBox.classList.add("show"); }
async function check() {
  let ok = false;
  try { ok = !!(navigator.xr && await navigator.xr.isSessionSupported("immersive-ar")); } catch (e) {}
  if (ok) { startBtn.disabled = false; statusBox.classList.remove("show"); return true; }
  return false;
}
(async () => {
  if (await check()) return;
  if (!IOS) return showStatus(/Android/.test(navigator.userAgent)
    ? "这个浏览器不支持网页 AR。请用 Chrome 打开，并确认手机装有“Google Play Services for AR”。"
    : "请用手机打开这个网页。电脑上无法使用相机 AR。");
  if (!KEY_SET) return showStatus("iPhone 需要通过 Variant Launch 才能使用这个模式，但页面里还没有填 SDK 密钥。暂时可以先用下面的旧版。");
  showStatus("正在切换到 AR 模式…");
  // iPhone：SDK 初始化后要么自动跳转到 Launch，要么（已经在 Launch 里）提供 WebXR
  addEventListener("vlaunch-initialized", async e => {
    if (await check()) return;
    const d = e.detail || {};
    if (d.launchUrl) showStatus('需要先打开 AR 模式：<a href="' + d.launchUrl + '">点这里继续</a>，然后在弹出的卡片上点“打开”。');
  });
  setTimeout(async () => {
    if (startBtn.disabled && !(await check()) && statusBox.textContent.indexOf("正在切换") === 0)
      showStatus("AR 模式没有启动。常见原因：SDK 密钥不对，或这个网址还没有在 Variant Launch 后台加入授权域名。");
  }, 8000);
})();
</script>
</body>
</html>
